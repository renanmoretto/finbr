[project]
name = "finbr"
version = "0.3.0"
description = "CLI (e biblioteca Python) para dados do mercado financeiro brasileiro: ações, índices, macro, B3."
authors = [
    {name = "Renan Moretto", email = "renan_moretto@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "cli", "finance", "brasil", "b3", "bovespa", "ibov",
    "cdi", "selic", "ipca", "bcb", "sgs", "di1", "cotahist",
    "fundamentus", "statusinvest", "mercado-financeiro",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "yfinance>=0.2.66,<0.3.0",
    "requests>=2.30.0,<3.0.0",
    "unidecode>=1.3.8,<2.0.0",
    "polars>=1.20.0,<2.0.0",
    "pyarrow>=15.0.0",
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.urls]
Repository = "https://github.com/renanmoretto/finbr"

[project.scripts]
finbr = "finbr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finbr"]
