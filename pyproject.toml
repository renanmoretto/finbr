[project]
name = "finbr"
version = "0.2.3"
description = "Coleção de utilitários Python para o mercado financeiro brasileiro."
authors = [
    {name = "Renan Moretto", email = "renan_moretto@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "yfinance>=0.2.54,<0.3.0",
    "requests>=2.30.0,<3.0.0",
    "unidecode>=1.3.8,<2.0.0",
    "polars>=1.20.0,<2.0.0",
    "pyarrow>=15.0.0",
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.urls]
Repository = "https://github.com/renanmoretto/finbr"

[project.scripts]
finbr = "finbr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finbr"]
